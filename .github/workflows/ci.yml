name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      # pr-checks.yml only runs when an app calls it, so nothing here exercises it.
      # actionlint at least catches syntax and expression errors before a release
      # ships a broken workflow to five repos.
      - name: Lint workflows
        run: |
          DIR="$(mktemp -d)"
          (cd "$DIR" && bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash))
          "$DIR/actionlint" -color
      - run: npm run format
      - run: npm run lint
      # Packs web-core and installs the tarball into the fixture app, then runs the
      # whole toolchain against it. This is the check that catches a breaking major.
      - run: npm test
