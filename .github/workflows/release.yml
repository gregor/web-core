name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance
    outputs:
      major-bump: ${{ steps.major.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # Read the outgoing `latest` before publishing moves it. A major bump means
      # the consumer contract broke, so a version-only bump PR cannot be enough —
      # see the fan-out job.
      - name: Detect a major bump
        id: major
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          NEW="${VERSION#v}"
          PREV="$(npm view @gregor_herdmann/web-core version 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "no published version yet; treating as not a major bump"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif [ "${PREV%%.*}" != "${NEW%%.*}" ]; then
            echo "$PREV -> $NEW crosses a major"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PREV -> $NEW stays within major ${NEW%%.*}"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }
      # npm refuses to publish a prerelease without an explicit --tag, and a
      # prerelease must not land on `latest` where the apps would pick it up.
      # Published via npm Trusted Publishing (OIDC), not a token: the account
      # requires a one-time password for publishing, which no CI token can supply.
      # OIDC sidesteps 2FA entirely and attests provenance on its own.
      - name: Publish
        run: |
          PKG="$(node -p "require('./package.json').version")"
          case "$PKG" in
            *-*) TAG=rc ;;
            *)   TAG=latest ;;
          esac
          echo "publishing $PKG under dist-tag $TAG"
          npm publish --access public --tag "$TAG"

      # The bump PR each app opens quotes this release, so it must exist before the
      # fan-out runs. Prereleases are marked as such and stay off the "latest" badge.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) PRE=--prerelease ;;
            *)   PRE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $PRE

      # The skipped fan-out job cannot annotate anything itself, so say it here.
      - name: Say why the fan-out will not run
        if: steps.major.outputs.bump == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "::warning title=Fan-out skipped::${VERSION#v} is a major, so no bump PRs were opened. Each app needs its migration by hand; see the release notes."

  fan-out:
    needs: publish
    # Prereleases are for piloting; they must not open bump PRs in all five apps.
    #
    # Majors are excluded for a subtler reason. The fan-out only bumps a version
    # string, and a major means the consumer contract broke — by definition that is
    # not enough. The resulting PR would go green while leaving the app half
    # migrated, which reads as "the upgrade is done" and is worse than no PR at all.
    # Majors are a human's job here, the same way dependabot-auto-merge.yml leaves
    # them alone.
    if: ${{ !contains(github.ref_name, '-') && needs.publish.outputs.major-bump != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [web-budget, web-dashboard, web-freelance, web-immo, web-todo]
    steps:
      # npm publish returns before the registry CDN serves the new version, so a
      # dispatch fired immediately makes consumers fail with ETARGET. Wait until the
      # version is actually installable before telling anyone about it.
      - name: Wait for the registry to serve ${{ github.ref_name }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          V="${VERSION#v}"
          for i in $(seq 1 30); do
            if npm view "@gregor_herdmann/web-core@$V" version >/dev/null 2>&1; then
              echo "$V is resolvable after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i: not yet resolvable"
            sleep 10
          done
          echo "::error title=Registry propagation::$V never became resolvable"
          exit 1

      # The publish already succeeded by this point, so a missing or expired
      # FANOUT_TOKEN must not fail the release. The apps still pick the new version
      # up through their weekly Dependabot run; the dispatch only makes it immediate.
      - name: Dispatch bump to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Fan-out skipped::FANOUT_TOKEN is not set, so ${{ matrix.repo }} was not notified. It will pick up ${VERSION#v} on its next weekly Dependabot run."
            exit 0
          fi
          if ! gh api "repos/${{ github.repository_owner }}/${{ matrix.repo }}/dispatches" \
              -f event_type=web-core-release \
              -F "client_payload[version]=${VERSION#v}"; then
            echo "::warning title=Fan-out failed::Could not dispatch to ${{ matrix.repo }}. Dependabot remains the fallback."
            exit 0
          fi
