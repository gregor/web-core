# Reusable workflow called by each web-* app. Keeping it here means an actions
# bump is reviewed once, not five times.
name: pr-checks

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Override Node version; defaults to engines.node from package.json'
        type: string
        required: false

permissions:
  contents: read

jobs:
  checks:
    # Rendered in the app as "<caller job name> / Format, Lint, Test & Build".
    name: Format, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - id: node
        run: |
          if [ -n "${{ inputs.node-version }}" ]; then
            echo "version=${{ inputs.node-version }}" >> "$GITHUB_OUTPUT"
          else
            # Apps pin ">=24"; setup-node would read that as a range and resolve to
            # whatever the newest release is, so strip it to a major. Guard the
            # missing-field case, which otherwise throws a bare TypeError.
            V="$(node -p "(require('./package.json').engines?.node ?? '').replace(/[^0-9.]/g,'')")"
            if [ -z "$V" ]; then
              echo "::error title=No Node version::package.json needs an engines.node field"
              exit 1
            fi
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      # Assert before running, so a removed test script reports what is wrong rather
      # than npm's bare "Missing script: test". The apps' script is `web-core test`,
      # which passes with no test files but fails loudly once a test exists.
      - name: Test
        run: |
          node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" || {
            echo '::error title=Missing test script::package.json needs a "test" script'
            exit 1
          }
          npm test
      - run: npm run build
